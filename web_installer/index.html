<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Instalador do Boi</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; color: #333; }
    h1 { color: #d32f2f; }
    .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 600px; }
    p { font-size: 1.1em; color: #555; }
    esp-web-install-button { margin-top: 20px; }
  </style>
  <script type="module" src="https://unpkg.com/esp-web-tools@9.0.0/dist/web/install-button.js?module"></script>
</head>
<body>
  <div class="container">
    <h1>Instalador Oficial - Boi Touch</h1>
    <p>Conecte a placa ESP32 no computador via cabo USB, clique no botão abaixo e selecione a porta correta para instalar a última versão do sistema de áudio.</p>
    <esp-web-install-button manifest="./manifest.json"></esp-web-install-button>
  </div>
</body>
</html>
